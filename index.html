<!DOCTYPE html>
<html lang="ko" data-theme="light" data-palette="kitchen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff7f2" />
    <title>MyBrary</title>
    <meta
      name="description"
      content="웹에서 본 것, 사진, 파일을 한곳에 붙이고 바로 태그를 다는 개인 스크랩 상자."
    />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("mybrary.theme");
          var dark =
            theme === "dark" ||
            (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var palette = localStorage.getItem("mybrary.palette");
          document.documentElement.setAttribute("data-palette", palette === "basalt" ? "basalt" : "kitchen");
          var lang = localStorage.getItem("mybrary.lang");
          if (lang === "en" || lang === "ko") document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
