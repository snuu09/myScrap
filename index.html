    />
    <link rel="icon" href="assets/favicon.svg?v=book" type="image/svg+xml" />
    <script>
      (function () {
        try {
          function take(key, legacy) {
            var next = localStorage.getItem(key);
            if (next != null) return next;
            var prev = localStorage.getItem(legacy);
            if (prev != null) {
              localStorage.setItem(key, prev);
              return prev;
            }
            return null;
          }
          var stored = take("mybrary.theme", "myscrap.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          if (take("mybrary.session", "myscrap.session")) {
            document.documentElement.setAttribute("data-surface", "app");
          }
          var palette = take("mybrary.palette", "myscrap.palette");
          if (palette === "basalt" || palette === "ai") {
            document.documentElement.setAttribute("data-palette", palette);
          }
        } catch (e) {}
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css"
    />
    <link rel="stylesheet" href="css/styles.css?v=bleed3" />
    <link rel="stylesheet" href="css/ai.css" />
  </head>

      OWN-WORLD: Fridge: peach porcelain, tangerine or basalt magnets, SUIT. AI: celadon accent, cooler ground, SUIT, editorial magazine feed. All palettes dock Stick at the bottom.
      STORY: Open the door or sign in, stick something, confirm type tags, find it newest-first.
      FIRST VIEWPORT: Compact header (brand, Sign in when signed out, settings). Intro is a full-bleed library still with hero and Open the shelf overlaid. Stick / classify / find hotspots sit on the objects. After the door: recency feed above a bottom stick dock.
      FORM: Fridge collage (seed 6b82be51). AI editorial feed.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
