<!DOCTYPE html>
<html lang="ko" data-theme="light" data-palette="deckle" data-look="glass">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <title>MyBrary</title>
    <meta
      name="description"
      content="텍스트, 링크, 영상, 파일, 이미지까지. 붙여넣기만 하면 AI가 읽고, 요약하고, 분류하는 나만의 서재."
    />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("mybrary.theme");
          var dark =
            theme === "dark" ||
            (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var palette = localStorage.getItem("mybrary.palette");
          var nextPalette = "deckle";
          if (palette === "editorial") nextPalette = "editorial";
          else if (palette === "deckle") nextPalette = "deckle";
          /* Legacy warm / kitchen / basalt → Soft Deckle */
          document.documentElement.setAttribute("data-palette", nextPalette);
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            if (nextPalette === "editorial") themeMeta.setAttribute("content", dark ? "#09090b" : "#ffffff");
            else if (dark) themeMeta.setAttribute("content", "#121214");
          }
          var look = localStorage.getItem("mybrary.look");
          document.documentElement.setAttribute("data-look", look === "library" ? "library" : "glass");
          var lang = localStorage.getItem("mybrary.lang");
          if (lang === "en" || lang === "ko") document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
