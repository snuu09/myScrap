<!DOCTYPE html>
<html lang="ko" data-surface="login" data-palette="kitchen">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>myScrap</title>
    <meta
      name="description"
      content="웹에서 본 것, 사진, 파일을 한곳에 붙이고 바로 태그를 다는 개인 스크랩 상자."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("myscrap.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          if (localStorage.getItem("myscrap.session")) {
            document.documentElement.setAttribute("data-surface", "app");
          }
          if (localStorage.getItem("myscrap.palette") === "basalt") {
            document.documentElement.setAttribute("data-palette", "basalt");
          }
        } catch (e) {}
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!--
      THESIS: A kitchen fridge door that holds whatever you just grabbed from the web or camera, not a notes sidebar of equal cards and not an AI chat on cream.
      OWN-WORLD: White login doorstep, peach porcelain fridge field, rubber gasket, stainless handle, disc magnets as tags (tangerine by default, basalt when 현무암 is on), mixed clipping sizes. SUIT grotesque. Graphite ink. One magnet accent. Night kitchen after dark.
      STORY: Open the door (sign in or browse), stick something in the freezer-band composer, and it snaps onto the door already tagged.
      FIRST VIEWPORT: Centered enamel door; vinyl myScrap top-left; personal capture line; Apple, Google, then Browse as the gasket pull. Language, magnet color (tangerine / basalt), and light/dark magnets top-right.
      FORM: Fridge-door collage (grounded list #4). Seed 6b82be51. Centered column, magnet discs.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <a class="skip-link" href="#main" data-i18n="skip">본문으로 건너뛰기</a>
    <div class="app-frame">
      <header class="site-header">
        <a class="brand" href="./index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name" data-i18n="appName">myScrap</span>
        </a>
        <div class="header-tools">
          <div class="lang-switch" role="group" data-i18n-aria="langSwitch" aria-label="언어">
            <button type="button" data-lang="ko" aria-pressed="true">KO</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </div>
          <div class="palette-switch" role="group" data-i18n-aria="paletteSwitch" aria-label="컬러 테마">
            <button type="button" data-palette-choice="kitchen" aria-pressed="true" data-i18n-aria="paletteKitchen" aria-label="기본">
              <span class="palette-dot palette-dot-kitchen" aria-hidden="true"></span>
              <span data-i18n="paletteKitchen">기본</span>
            </button>
            <button type="button" data-palette-choice="basalt" aria-pressed="false" data-i18n-aria="paletteBasalt" aria-label="현무암">
              <span class="palette-dot palette-dot-basalt" aria-hidden="true"></span>
              <span data-i18n="paletteBasalt">현무암</span>
            </button>
          </div>
          <div class="theme-switch" role="group" data-i18n-aria="themeSwitch" aria-label="화면 모드">
            <button type="button" data-theme-choice="light" aria-pressed="false" data-i18n-aria="themeLight" aria-label="라이트">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
            </button>
            <button type="button" data-theme-choice="system" aria-pressed="true" data-i18n-aria="themeSystem" aria-label="시스템">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="7" />
                <path d="M12 5v14" />
                <path d="M12 5a7 7 0 0 1 0 14" fill="currentColor" stroke="none" opacity="0.35" />
              </svg>
            </button>
            <button type="button" data-theme-choice="dark" aria-pressed="false" data-i18n-aria="themeDark" aria-label="다크">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M16.5 13.5A7 7 0 0 1 10.2 5.1 7.2 7.2 0 1 0 18.8 14.8a7 7 0 0 1-2.3-1.3z" />
              </svg>
            </button>
          </div>
          <span class="session-chip" data-session-label hidden></span>
          <button type="button" class="ghost-btn" data-action="logout" hidden data-i18n="logout">
            나가기
          </button>
        </div>
      </header>

      <main id="main" class="site-main">
        <div class="door">
          <div class="door-inner">
            <section id="view-login" class="view login-panel" aria-labelledby="login-lead">
              <h1 id="login-lead" class="login-lead" data-i18n="loginLead">
                문을 열고, 방금 본 것을 붙이세요.
              </h1>
              <p class="login-hint" data-i18n="loginHint">
                이 기기 안에만 쌓입니다. 팀 공간이 아닙니다.
              </p>
              <div class="auth-stack">
                <button type="button" class="auth-btn auth-apple" data-auth="apple">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M16.7 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.8-.4 6.9 1.1 9.1.8 1.1 1.7 2.3 2.9 2.2 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-.1 2.9-2.2c1-.1 2-1.2 2.8-2.3-2.3-1-2.7-3.1-2.7-3.2zM14.6 6.5c.6-.8 1.1-1.8.9-2.9-1 .1-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.8 1.1.1 2.2-.5 2.9-1.4z"
                    />
                  </svg>
                  <span data-i18n="apple">Apple ID로 계속</span>
                </button>
                <button type="button" class="auth-btn auth-google" data-auth="google">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" />
                    <path fill="#34A853" d="M12 22c2.7 0 5-0.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" />
                    <path fill="#FBBC05" d="M6.4 13.9A6 6 0 0 1 6.1 12c0-.7.1-1.3.3-1.9V7.5H3.1A10 10 0 0 0 2 12c0 1.6.4 3.1 1.1 4.5l3.3-2.6z" />
                    <path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9C16.9 2.8 14.7 2 12 2A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.6 9.4 5.9 12 5.9z" />
                  </svg>
                  <span data-i18n="google">Google 계정으로 계속</span>
                </button>
                <button type="button" class="auth-btn auth-browse" data-auth="browse">
                  <span data-i18n="browse">둘러보기</span>
                </button>
                <p class="browse-hint" data-i18n="browseHint">
                  계정 없이 이 기기에서만 저장됩니다.
                </p>
              </div>
            </section>

            <section id="view-app" class="view" hidden>
              <div class="freezer-band">
                <form class="composer" id="composer" data-i18n-aria="composerLabel" aria-label="스크랩 입력">
                  <div class="drop-overlay" data-i18n="dropOverlay">여기에 놓으면 붙습니다.</div>
                  <div class="add-wrap">
                    <button
                      type="button"
                      class="icon-btn"
                      id="add-btn"
                      aria-haspopup="menu"
                      aria-expanded="false"
                      aria-controls="add-menu"
                      data-i18n-aria="addMenu"
                      aria-label="추가"
                    >
                      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 5v14M5 12h14" />
                      </svg>
                    </button>
                    <div class="add-menu" id="add-menu" role="menu" hidden>
                      <button type="button" role="menuitem" data-action="clipboard">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                          <rect x="8" y="4" width="12" height="16" rx="1.5" />
                          <path d="M8 8H5.5A1.5 1.5 0 0 1 4 6.5v-1A1.5 1.5 0 0 1 5.5 4H10" />
                        </svg>
                        <span data-i18n="clipboard">클립보드</span>
                      </button>
                      <button type="button" role="menuitem" data-action="camera" data-camera-only>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                          <path d="M4 8h3l2-3h6l2 3h3v11H4V8z" />
                          <circle cx="12" cy="13" r="3.2" />
                        </svg>
                        <span data-i18n="camera">카메라</span>
                      </button>
                      <button type="button" role="menuitem" data-action="photo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                          <rect x="3" y="5" width="18" height="14" rx="1.5" />
                          <circle cx="8.5" cy="10" r="1.5" />
                          <path d="M21 16l-5.5-5.5-8.5 8" />
                        </svg>
                        <span data-i18n="photo">사진 선택</span>
                      </button>
                      <button type="button" role="menuitem" data-action="file">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                          <path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V8l-4-5z" />
                          <path d="M14 3v5h5" />
                        </svg>
                        <span data-i18n="file">파일 첨부</span>
                      </button>
                    </div>
                  </div>
                  <label class="sr-only" for="composer-input" data-i18n="composerLabel">스크랩 입력</label>
                  <textarea
                    id="composer-input"
                    class="composer-field"
                    rows="1"
                    data-i18n-placeholder="placeholder"
                    placeholder="붙여넣기 할 내용이나 파일을 첨부해주세요."
                  ></textarea>
                  <button type="submit" class="send-btn" id="send-btn" data-i18n="send" disabled>붙이기</button>
                  <input id="file-photo" class="hidden-file" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true" />
                  <input id="file-camera" class="hidden-file" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true" />
                  <input id="file-any" class="hidden-file" type="file" multiple tabindex="-1" aria-hidden="true" />
                </form>
                <p class="status-line" id="status-line" role="status" aria-live="polite"></p>
                <section id="draft-panel" class="draft-panel" hidden aria-live="polite"></section>
              </div>

              <div id="list-wrap">
                <div class="list-tools" id="list-tools" hidden>
                  <label class="sr-only" for="scrap-search" data-i18n="searchLabel">조각 찾기</label>
                  <input
                    id="scrap-search"
                    class="scrap-search"
                    type="search"
                    data-i18n-placeholder="searchPlaceholder"
                    placeholder="제목, 메모, 파일, 주소, 태그"
                  />
                  <div class="type-chips" id="type-chips" role="group" data-i18n-aria="typeFilter" aria-label="종류"></div>
                  <div class="tag-filter-bar" id="tag-filter-bar" hidden></div>
                </div>
                <div class="empty-state" id="empty-state">
                  <p data-i18n="empty">항목이 없습니다.</p>
                  <p class="empty-hint" data-i18n="emptyHint">
                    링크, 사진, 메모, 파일을 붙인 뒤 미리 보고 저장하세요.
                  </p>
                  <button type="button" class="text-btn" data-action="samples" data-i18n="loadSamples">
                    견본 보기
                  </button>
                </div>
                <div class="empty-state" id="filter-empty" hidden>
                  <p data-i18n="noMatches">이 조건에 맞는 조각이 없습니다.</p>
                  <button type="button" class="text-btn" data-action="clear-filters" data-i18n="clearFilters">
                    조건 지우기
                  </button>
                </div>
                <ul class="scrap-list" id="scrap-list" hidden></ul>
              </div>
            </section>
          </div>
        </div>
      </main>

      <footer class="site-footer">
        <p class="footer-note">
          <span data-i18n="footerMark">myScrap</span>
          ·
          <span data-i18n="footerNote">붙여 둔 조각은 이 브라우저에만 남습니다.</span>
        </p>
        <div class="footer-tools">
          <button type="button" class="text-btn" data-action="clear" hidden data-i18n="clear">비우기</button>
        </div>
      </footer>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <button type="button" class="lightbox-close" id="lightbox-close" data-i18n-aria="lightboxClose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <img id="lightbox-image" alt="" />
    </div>

    <button type="button" class="to-top" id="to-top" hidden data-i18n-aria="scrollTop" aria-label="맨 위로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M6 14l6-6 6 6" />
      </svg>
    </button>

    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/backend.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tagger.js"></script>
    <script src="js/phish.js"></script>
    <script src="js/og.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
